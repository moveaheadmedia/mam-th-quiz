<!doctype html>
<html lang="en-AU" data-market="AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Which Digital Marketing Services Do You Need? | Move Ahead Media
    </title>
    <meta
      name="description"
      content="Answer 5 quick questions and get a personalised digital marketing plan — SEO + AI Visibility, Google Ads, Social Media or Website Development. Takes 60 seconds."
    />
    <meta name="robots" content="index, follow" />
    <!-- The Australian quiz, live at moveaheadmedia.com.au/quiz/: the English
         quiz, with its links going to moveaheadmedia.com.au (data-market="AU"
         above, see config.js). It has no language switch. -->
    <link rel="canonical" href="https://www.moveaheadmedia.com.au/quiz/" />
    <link rel="alternate" hreflang="en-AU" href="https://www.moveaheadmedia.com.au/quiz/" />
    <link rel="alternate" hreflang="en-TH" href="https://www.moveaheadmedia.co.th/quiz/" />
    <link rel="alternate" hreflang="th-TH" href="https://www.moveaheadmedia.co.th/th/quiz/" />
    <link rel="alternate" hreflang="x-default" href="https://www.moveaheadmedia.com.au/quiz/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="th_TH" />
    <meta
      property="og:title"
      content="Which Digital Marketing Services Do You Need? | Move Ahead Media"
    />
    <meta
      property="og:description"
      content="Answer 5 quick questions and get a personalised digital marketing plan in 60 seconds."
    />
    <meta
      property="og:image"
      content="https://www.moveaheadmedia.co.th/wp-content/uploads/2023/10/mamlogo-dynamicwhite.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="../assets/icons/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="../assets/icons/android-chrome-192x192.png"
    />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#quiz">Skip to the quiz</a>

    <header class="site-header">
      <div class="shell site-header__inner">
        <a
          class="site-header__logo"
          href="https://www.moveaheadmedia.com.au/"
          target="_blank"
          rel="noopener"
        >
          <img
            src="https://www.moveaheadmedia.co.th/wp-content/uploads/2023/10/mamlogo-dynamicwhite.png"
            alt="Move Ahead Media"
            width="180"
            height="40"
          />
        </a>
        <div class="site-header__actions">
          <a
            class="btn btn--ghost btn--sm site-header__cta"
            data-quiz-cta="consultation"
            data-cta-location="header"
            href="https://www.moveaheadmedia.com.au/contact-us/"
            target="_blank"
            rel="noopener"
            >Talk to us</a
          >
        </div>
      </div>
    </header>

    <main id="quiz" class="shell">
      <!-- ── Progress ────────────────────────────────────────────────── -->
      <nav class="progress" id="progress" aria-label="Quiz progress" hidden>
        <ol class="progress__steps" id="progressSteps"></ol>
        <div class="progress__track">
          <div class="progress__fill" id="progressFill"></div>
        </div>
      </nav>

      <!-- ── Stage ───────────────────────────────────────────────────── -->
      <div class="stage" id="stage" aria-live="polite"></div>

      <p class="stage-note" id="stageNote"></p>
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p>
          &copy; <span id="year"></span> Move Ahead Media — Think Ahead, Move
          Ahead.
        </p>
        <p class="site-footer__links">
          <a
            href="https://www.moveaheadmedia.com.au/"
            target="_blank"
            rel="noopener"
            >Website</a
          >
          <a
            href="https://www.moveaheadmedia.com.au/about/case-studies/"
            target="_blank"
            rel="noopener"
            >Case studies</a
          >
          <a
            href="https://www.moveaheadmedia.com.au/contact-us/"
            target="_blank"
            rel="noopener"
            >Contact</a
          >
        </p>
      </div>
    </footer>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/utm.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/engine.js"></script>
    <!-- Logic v5. Loaded but not yet called — app.js switches to it in
         build step 3, so this file changes nothing on its own. -->
    <script src="../assets/js/planner.js"></script>
    <!-- Screen text. th/index.html also loads i18n/th.js before i18n.js. -->
    <script src="../assets/js/i18n/en.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
