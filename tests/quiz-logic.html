<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MAM Quiz Logic Regression Tests</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #101217;
        color: #e7eaf0;
      }
      body {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font: 700 22px/1.3 system-ui, sans-serif;
      }
      p {
        margin: 0 0 24px;
        color: #aab2c0;
        font-family: system-ui, sans-serif;
      }
      #test-output {
        border: 1px solid #303642;
        border-radius: 10px;
        overflow: hidden;
      }
      #test-output div {
        padding: 8px 12px;
        border-bottom: 1px solid #252a34;
        white-space: pre-wrap;
      }
      #test-output div:last-child {
        border-bottom: 0;
      }
      .pass {
        color: #75dba8;
      }
      .fail {
        color: #ff8f8f;
      }
      .summary {
        font-weight: 700;
        background: #191d25;
      }
    </style>
  </head>
  <body>
    <h1>MAM Quiz Logic Regression Tests</h1>
    <p>
      Dependency-free audit of canonical recommendations, all 600 complete
      answer combinations, tie rules, eligibility, and budget phasing.
    </p>
    <div id="test-output" aria-live="polite"></div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/engine.js"></script>
    <script src="quiz-logic.test.js"></script>
  </body>
</html>
